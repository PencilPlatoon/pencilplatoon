<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pencil Vector · Asset tool</title>
<link rel="stylesheet" href="/pv-common.css">
<style>
  header .sc-toggle{margin-left:auto}
  .subjectbar{display:flex;align-items:center;gap:6px;padding:8px 18px;border-bottom:1px solid var(--hair);overflow-x:auto}
  .subjects{display:flex;gap:6px;flex-wrap:wrap}
  .subjects button{position:relative;font:inherit;font-size:12px;padding:5px 12px;border-radius:16px;cursor:pointer;
    background:var(--btn);border:1px solid var(--btn-line);color:var(--ink)}
  .subjects button.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .subjects button.pending{opacity:.5;border-style:dashed}
  .chk{position:absolute;top:-5px;right:-5px;width:15px;height:15px;border-radius:50%;background:var(--green);
    color:#fff;font:700 10px/15px var(--sans);text-align:center;box-shadow:0 0 0 2px var(--bg)}
  .cbar{position:absolute;top:12px;left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:5}
  .cbar button{font:inherit;font-size:12.5px;padding:6px 12px;border-radius:7px;cursor:pointer;
    background:var(--btn);border:1px solid var(--btn-line);color:var(--ink)}
  .cbar button:hover:not(:disabled){border-color:var(--blue)}
  .cbar button:disabled{opacity:.4;cursor:not-allowed}
  .sc-toggle{font:inherit;font-size:12px;padding:5px 11px;border-radius:16px;cursor:pointer;white-space:nowrap;
    background:var(--btn);border:1px solid var(--btn-line);color:var(--ink)}
  .sc-toggle:hover{border-color:var(--blue)}
  .sc-toggle.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .guide,.shortcuts{flex:none;border-left:1px solid var(--hair);padding:14px 16px;overflow:auto}
  .guide{width:210px} .shortcuts{width:172px} .shortcuts[hidden]{display:none}
  .guide h3,.shortcuts h3{margin:0 0 10px;font:600 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
  .guide h3.assets-h{margin-top:20px;padding-top:16px;border-top:1px solid var(--hair)}
  .curasset{display:flex;flex-direction:column;gap:7px}
  .curasset input{width:100%;font-size:13px;font-family:var(--mono);padding:6px 10px;border-radius:6px;
    background:var(--panel);border:1px solid var(--hair);color:var(--ink)}
  .curasset input:focus{outline:none;border-color:var(--blue)}
  .curasset button{width:100%;font:inherit;font-size:12.5px;padding:6px 12px;border-radius:7px;cursor:pointer;
    background:var(--btn);border:1px solid var(--btn-line);color:var(--ink)}
  .curasset button:hover{border-color:var(--blue)}
  .shortcuts table{border-collapse:collapse;font-size:12px;width:100%}
  .shortcuts td{padding:4px 0;vertical-align:top}
  .shortcuts td.k{font-family:var(--mono);color:var(--ink);white-space:nowrap;padding-right:12px}
  .shortcuts td.a{color:var(--muted)}
  .guide .exports{display:flex;flex-direction:column;gap:8px;margin-top:4px}
  .guide .exports .none{font-size:12px;color:var(--muted)}
  .guide .exp{margin:0;border-radius:7px;display:flex;align-items:center;gap:6px}
  .guide .exp .thumb{flex:1;min-width:0;cursor:pointer}
  .guide .exp img{width:100%;background:var(--paper);border:1px solid var(--hair);border-radius:6px;display:block}
  .guide .exp.on img{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}
  .guide .exp .trash{flex:none;width:26px;height:26px;display:flex;align-items:center;justify-content:center;
    border:none;border-radius:6px;cursor:pointer;color:var(--muted);background:none}
  .guide .exp .trash:hover{color:var(--red)}
  .guide .exp figcaption{font-size:11px;color:var(--muted);margin-top:3px;word-break:break-word}
  .guide .exp.on figcaption{color:var(--ink)}
  .rotcol{position:absolute;box-sizing:border-box;width:40px;display:flex;flex-direction:column;
    align-items:center;gap:10px;padding:2px 0}
  .rotcol output{font:600 11px var(--mono);color:var(--ink)}
  .rotcol input[type=range]{-webkit-appearance:none;appearance:none;writing-mode:vertical-lr;
    width:16px;flex:1;min-height:60px;background:transparent;cursor:pointer;margin:0}
  .rotcol input[type=range]::-webkit-slider-runnable-track{background:#fff;border:1px solid var(--hair);border-radius:8px}
  .rotcol input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;
    border-radius:50%;background:var(--blue);border:none;box-shadow:0 1px 2px rgba(0,0,0,.35)}
  .rotcol input[type=range]::-moz-range-track{background:#fff;border:1px solid var(--hair);border-radius:8px}
  .rotcol input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--blue);border:none}
  .rotcol .flips{display:flex;flex-direction:column;gap:6px;width:100%;padding:0 3px}
  .rotcol .flips button{font-size:14px;line-height:1;padding:6px 0;border-radius:6px;cursor:pointer;
    background:var(--btn);border:1px solid var(--btn-line);color:var(--ink)}
  .rotcol .flips button:hover{border-color:var(--blue)}
  .rotcol .flips button.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .canvas{flex:1;display:grid;place-items:center;padding:52px 56px 20px 20px;overflow:auto;position:relative}
  .scanref{flex:1;display:flex;flex-direction:column;min-width:0;padding:14px 16px;border-right:1px solid var(--hair)}
  .scanref[hidden]{display:none}
  .scantabs{display:flex;gap:4px;justify-content:center;flex:none;margin-bottom:12px}
  .scanimgwrap{flex:1;display:grid;place-items:center;min-height:0;overflow:auto}
  .scanref img{max-width:100%;max-height:100%;border-radius:4px;box-shadow:0 12px 40px -16px #000;background:var(--paper)}
  #numbadge{position:absolute;top:26px;left:26px;z-index:6;background:var(--red);color:#fff;
    font-family:var(--mono);font-weight:700;font-size:15px;min-width:22px;height:26px;border-radius:13px;
    padding:0 9px;display:none;align-items:center;justify-content:center;box-shadow:0 4px 14px -4px #000}
  .canvas svg{background:var(--paper);border-radius:8px;max-width:100%;max-height:100%;
    box-shadow:0 12px 40px -16px #000}

  /* drawing elements */
  .edge{fill:none;stroke:var(--col,#141414);stroke-linecap:round;stroke-linejoin:round}
  .blob{fill:var(--col,#141414);stroke:none}
  .hit{stroke:transparent;fill:none;pointer-events:stroke;cursor:pointer}
  .hit.blobhit{fill:transparent;pointer-events:fill}
  .el.hover .edge,.el.hover .blob{stroke:var(--red)}
  .el.hover .blob{fill:var(--red)}
  .el.sel .edge{stroke:var(--blue)} .el.sel .blob{fill:var(--blue)}
  .el.hidden{opacity:.12}
  .el.hidden.hover{opacity:1}                                 /* hovering a deleted segment reveals it, so you can pick it */
  .el.hidden.sel{opacity:1}                                   /* selected for undelete -> fully visible, in green */
  .el.hidden.sel .edge{stroke:var(--green)} .el.hidden.sel .blob{fill:var(--green)}
  .marquee{fill:rgba(88,120,230,.10);stroke:var(--blue);stroke-width:1.4;stroke-dasharray:6 4;
    vector-effect:non-scaling-stroke;pointer-events:none}
  /* waiting indicator shown in the drawing area while a box vectorizes */
  .waiting{position:absolute;inset:52px 56px 20px 20px;display:flex;flex-direction:column;gap:14px;
    align-items:center;justify-content:center;background:var(--paper);border-radius:8px;
    color:#6b675c;font-size:13px;z-index:5}
  .waiting[hidden]{display:none}
  .waiting .spinner{width:34px;height:34px;border-radius:50%;border:3px solid #d9d2c2;
    border-top-color:var(--blue);animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* copyable stack trace shown in place of the drawing when vectorization fails */
  .errbox{position:absolute;inset:52px 56px 20px 20px;z-index:6;box-sizing:border-box;resize:none;
    font-family:var(--mono);font-size:11px;line-height:1.45;color:var(--ink);background:var(--paper);
    border:1px solid var(--red);border-radius:8px;padding:12px 14px;white-space:pre}
  .errbox[hidden]{display:none}
</style>
</head>
<body>
<header>
  <h1>Pencil&nbsp;Vector</h1>
  <div class="tabs">
    <button id="tabBoxer" class="tab">box selector</button>
    <button id="tabAsset" class="tab on">asset tool</button>
  </div>
  <button id="scBtn" class="sc-toggle" title="Show keyboard shortcuts">Shortcuts</button>
</header>
<div class="subjectbar"><div class="subjects" id="subjects"></div></div>
<div class="stage">
  <aside class="scans">
    <h3>Scans</h3>
    <ul id="scanlist"></ul>
  </aside>
  <div class="scanref" id="scanref">
    <div class="scantabs">
      <button id="scanOrigBtn" class="tab on">Original scan</button>
      <button id="scanCleanBtn" class="tab">Cleaned scan</button>
    </div>
    <div class="scanimgwrap"><img id="scanimg" alt="scan"></div>
  </div>
  <div class="canvas">
    <div class="cbar"><button id="revecBtn">Re-vectorize</button><button id="clrBtn">Clear selection</button><button id="resetBtn">Reset drawing</button></div>
    <svg id="view" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="numbadge"></div>
    <div id="waiting" class="waiting" hidden><div class="spinner"></div><span id="waitmsg">vectorizing…</span></div>
    <textarea id="errbox" class="errbox" readonly spellcheck="false" hidden></textarea>
    <div class="rotcol">
      <output id="rotOut">0°</output>
      <input id="rotSlider" type="range" min="-180" max="180" value="0" step="1">
      <div class="flips"><button id="flipXBtn" title="Flip horizontal">⇄</button><button id="flipYBtn" title="Flip vertical">⇅</button></div>
    </div>
  </div>
  <aside class="guide">
    <h3>Current asset</h3>
    <div class="curasset">
      <input id="assetName" type="text" value="unnamed" spellcheck="false" autocomplete="off">
      <button id="saveBtn">Save new asset</button>
    </div>
    <h3 class="assets-h">Assets</h3>
    <div id="exports" class="exports"></div>
  </aside>
  <aside class="shortcuts" id="shortcuts" hidden>
    <h3>Shortcuts</h3>
    <table>
      <tr><td class="k">click</td><td class="a">toggle</td></tr>
      <tr><td class="k">drag</td><td class="a">box-select</td></tr>
      <tr><td class="k">⇧ drag</td><td class="a">box-deselect</td></tr>
      <tr><td class="k">⌘ click</td><td class="a">+fill</td></tr>
      <tr><td class="k">⇧⌘ click</td><td class="a">−fill</td></tr>
      <tr><td class="k">⌥ click</td><td class="a">whole stroke</td></tr>
      <tr><td class="k">⌘A</td><td class="a">select all</td></tr>
      <tr><td class="k">⇧⌘A</td><td class="a">deselect all</td></tr>
      <tr><td class="k">Del</td><td class="a">delete</td></tr>
      <tr><td class="k">U</td><td class="a">undelete</td></tr>
      <tr><td class="k">⌘S</td><td class="a">save</td></tr>
    </table>
  </aside>
</div>
<script src="/pv-common.js"></script>
<script>
let MODELS = {}, SCAN = null, SCANBOXES = [];

let model, baseModel, adj, selected, hidden, rot = 0, flipX = false, flipY = false;
let currentAsset = null;                                          // the saved asset currently loaded (its id), or null for a fresh box

function buildAdjacency(m){
  // hub key -> [edge sid]. A hub is a skeleton node ("n"+id) OR a blob sid, so a
  // blob is a connectivity hub the flood can pass through (§6.3, raw adjacency).
  const hub = new Map();
  const push = (k, es) => { if(!hub.has(k)) hub.set(k, []); hub.get(k).push(es); };
  for(const e of m.edges){
    push("n"+e.a, e.sid); push("n"+e.b, e.sid);
    for(const bs of (e.blobs||[])) push(bs, e.sid);
  }
  return { hub, edge:new Map(m.edges.map(e=>[e.sid,e])), blob:new Map(m.blobs.map(b=>[b.sid,b])) };
}

function floodFrom(startSid){
  // everything reachable through shared nodes AND blob attachments; returns the
  // sids of both edges and blobs in the connected component. Works from either.
  // hidden (deleted) elements cut connectivity -- flood neither enters nor crosses them
  const out = new Set(), seenE = new Set(), seenB = new Set(), q = [];
  const takeBlob = bs => { if(seenB.has(bs) || hidden.has(bs)) return; seenB.add(bs); out.add(bs);
    for(const es of (adj.blob.get(bs).edges||[])) if(!seenE.has(es) && !hidden.has(es)){ seenE.add(es); q.push(es); } };
  const takeEdge = es => { if(!seenE.has(es) && !hidden.has(es)){ seenE.add(es); q.push(es); } };
  adj.blob.has(startSid) ? takeBlob(startSid) : takeEdge(startSid);
  while(q.length){
    const e = adj.edge.get(q.pop()); out.add(e.sid);
    for(const nid of [e.a, e.b]){                               // skeleton-node hub
      const myP = (e.cont||{})[nid];                            // e's through-partner here
      for(const es of (adj.hub.get("n"+nid)||[])){
        if(es === e.sid) continue;
        const otherP = (adj.edge.get(es).cont||{})[nid];
        if(myP && otherP && myP !== es) continue;               // two crossing strokes -> don't leak
        takeEdge(es);
      }
    }
    for(const bs of (e.blobs||[])) takeBlob(bs);                // blob hub (no continuity)
  }
  return out;
}

function strokeChain(startSid){
  // the single continuity chain through junctions -- one stroke (§10 "select stroke")
  if(!adj.edge.has(startSid)) return new Set([startSid]);       // a blob: just itself
  const out = new Set([startSid]), q = [startSid];
  while(q.length){
    const e = adj.edge.get(q.pop());
    for(const nid of [e.a, e.b]){ const p = (e.cont||{})[nid];
      if(p && !out.has(p) && !hidden.has(p)){ out.add(p); q.push(p); } }
  }
  return out;
}

function render(){
  for(const el of document.querySelectorAll(".el")){
    const sid = el.dataset.sid;
    el.classList.toggle("sel", selected.has(sid));            // a deleted segment can be selected too (to undelete it)
    el.classList.toggle("hidden", hidden.has(sid));
  }
}

// ---- shared geometry/colour emitters (one source of truth for the on-screen SVG and the exported one)
function rgbOf(c){ return ((model.palette || [])[c || 0]) || [20, 20, 20]; }   // element colour id -> [r,g,b]
function blobPathD(b){                                           // even-odd path: outer ring + holes (§6.2)
  let d = "M" + b.boundary.map(p=>p.join(" ")).join("L") + "Z";
  for(const h of (b.holes||[])) d += " M" + h.map(p=>p.join(" ")).join("L") + "Z";
  return d;
}
function edgePts(e){ return e.pts.map(p=>p.join(",")).join(" "); }
function contentBounds(m, map){                                  // bbox over every point of every element (map: optional pt transform)
  let x0=Infinity, y0=Infinity, x1=-Infinity, y1=-Infinity;
  const grow = p => { const q = map ? map(p[0], p[1]) : p;
    if(q[0]<x0)x0=q[0]; if(q[1]<y0)y0=q[1]; if(q[0]>x1)x1=q[0]; if(q[1]>y1)y1=q[1]; };
  for(const b of m.blobs) b.boundary.forEach(grow);
  for(const e of m.edges) e.pts.forEach(grow);
  return {x0, y0, x1, y1};
}

function colorStyle(c){                                          // base colour via a CSS var, so hover/select rules still override
  const p = c && (model.palette || [])[c];
  return p ? ` style="--col:rgb(${p[0]},${p[1]},${p[2]})"` : "";
}
function draw(){
  const m = model, sw = Math.max(1, m.w), svg = $("#view"); let n = 0;
  // number blobs first, then edges -- same order as the comparison page's tabs
  const parts = [];
  for(const b of m.blobs){
    const d = blobPathD(b);
    parts.push(`<g class="el" data-sid="${b.sid}" data-num="${++n}"${colorStyle(b.color)}><path class="blob" d="${d}" fill-rule="evenodd"/>`
      + `<path class="hit blobhit" d="${d}" fill-rule="evenodd"/></g>`);
  }
  for(const e of m.edges){
    const pts = edgePts(e);
    parts.push(`<g class="el" data-sid="${e.sid}" data-eid="${e.id}" data-num="${++n}"${colorStyle(e.color)}>`
      + `<polyline class="edge" points="${pts}" stroke-width="${sw}"/>`
      + `<polyline class="hit" points="${pts}" stroke-width="${sw*2.8}"/></g>`);
  }
  svg.setAttribute("viewBox", `0 0 ${m.size[0]} ${m.size[1]}`);
  svg.innerHTML = parts.join("");                   // repopulate the SAME node -> its once-wired listeners survive
}

function transformModel(base, rotDeg, fx, fy){        // rigid rotate + flip about the content centre, re-cropped to fit
  const th = rotDeg*Math.PI/180, cos = Math.cos(th), sin = Math.sin(th);
  const sx = fx ? -1 : 1, sy = fy ? -1 : 1;
  const bb = contentBounds(base);                                  // base content bounds -> centre
  const cx=(bb.x0+bb.x1)/2, cy=(bb.y0+bb.y1)/2;
  const pre = (x,y)=>{ const dx=x-cx, dy=y-cy;           // rotate first, then flip -> flip acts on the rotated result
    return [ (dx*cos - dy*sin)*sx, (dx*sin + dy*cos)*sy ]; };
  const tb = contentBounds(base, pre);                             // bounds AFTER transform -> grows to fit the rotation
  const PAD = Math.max(2, base.w || 1);                             // keep stroke caps off the crop
  const ox = PAD - tb.x0, oy = PAD - tb.y0;
  const T = pts => pts.map(p => { const q=pre(p[0],p[1]); return [ +(q[0]+ox).toFixed(1), +(q[1]+oy).toFixed(1) ]; });
  return { ...base,
    blobs: base.blobs.map(bl => ({ ...bl, boundary: T(bl.boundary), holes: (bl.holes||[]).map(T) })),
    edges: base.edges.map(e => ({ ...e, pts: T(e.pts) })),
    size: [ +(tb.x1-tb.x0+2*PAD).toFixed(1), +(tb.y1-tb.y0+2*PAD).toFixed(1) ] };
}

function placeRotcol(){                                            // span the drawing PANEL's full height, not the SVG's:
  const svg = $("#view"), col = $(".rotcol"), canvas = $(".canvas");// rotating a non-square image changes the SVG's height,
  if(!svg || !col || !canvas) return;                              // which would resize the slider track mid-drag and make
  const s = svg.getBoundingClientRect(), c = canvas.getBoundingClientRect();  // its value fluctuate. The panel height is fixed.
  const cs = getComputedStyle(canvas), padT = parseFloat(cs.paddingTop), padB = parseFloat(cs.paddingBottom);
  col.style.top = padT + "px";
  col.style.height = (canvas.clientHeight - padT - padB) + "px";
  col.style.left = (s.right - c.left) + "px";                      // still tracks the drawing's right edge horizontally
}
function refresh(){ draw(); render(); placeRotcol(); }   // wireCanvas() runs once at init -- the #view node is stable
function applyTransform(){ model = transformModel(baseModel, rot, flipX, flipY); refresh(); }

function setTransform(r, fx, fy){                                  // write the transform state to the globals AND their widgets
  rot = r; flipX = fx; flipY = fy;
  $("#rotSlider").value = rot; $("#rotOut").textContent = rot + "°";
  $("#flipXBtn").classList.toggle("on", flipX); $("#flipYBtn").classList.toggle("on", flipY);
}
function setScanTab(which){                                        // which of the two scan-reference tabs is active
  $("#scanOrigBtn").classList.toggle("on", which !== "clean");
  $("#scanCleanBtn").classList.toggle("on", which === "clean");
}

function showScan(which){                                          // toggle the scan reference between the original crop and the cleaned pipeline input
  $("#scanimg").src = "data:image/jpeg;base64," + (which === "clean" ? baseModel.scan_clean : baseModel.scan);
  setScanTab(which);
}
function showScanCrop(box){                                        // show the ORIGINAL scan crop right away, before the model vectorizes
  if(!SCAN || !box || box.x1 == null) return;                     // (the cleaned crop only exists post-pipeline, so its tab waits)
  const im = new Image();
  im.onload = () => {
    const w = box.x1 - box.x0, h = box.y1 - box.y0;
    const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
    cv.getContext("2d").drawImage(im, box.x0, box.y0, w, h, 0, 0, w, h);
    $("#scanimg").src = cv.toDataURL("image/png");
    $("#scanref").hidden = false;
    setScanTab("orig"); $("#scanCleanBtn").disabled = true;
  };
  im.src = "/scan/" + encodeURIComponent(SCAN);
}
function loadSubject(name){
  $("#waiting").hidden = true; $("#errbox").hidden = true;         // model is ready -- clear any waiting/error overlay
  if(SCAN) localStorage.setItem("pv:lastbox:" + SCAN, name);       // remember it, so the boxer's asset-tool tab reopens it
  baseModel = MODELS[name]; adj = buildAdjacency(baseModel);        // adjacency is sid-based, transform-independent
  setTransform(0, false, false);
  if(baseModel.scan){
    $("#scanref").hidden = false;
    $("#scanCleanBtn").disabled = !baseModel.scan_clean;        // demo subjects have no cleaned crop
    showScan("orig");                                           // default to the original scan
  } else { $("#scanimg").removeAttribute("src"); $("#scanref").hidden = true; }
  selected = new Set(); hidden = new Set();
  currentAsset = null;                                            // a fresh box -- not editing any saved asset
  for(const b of document.querySelectorAll(".subjects button")) b.classList.toggle("on", b.dataset.name===name);
  $("#assetName").value = name;                                    // the box name seeds a new asset's name
  renderExports(name); updateAssetBar();
  applyTransform();
}

function loadAsset(a){                                            // reload a saved asset's editing state back into the drawing
  const st = a.state || {};
  hidden = new Set(st.hidden || []); selected = new Set();
  setTransform(st.rot || 0, !!st.flipX, !!st.flipY);
  $("#assetName").value = a.name || a.asset.replace(/\.svg$/, "");
  currentAsset = a.asset; updateAssetBar();
  applyTransform();                                               // redraw with the restored transform; render() re-applies hidden
}

function updateAssetBar(){                                        // one button: updates the loaded asset, or saves a new one
  $("#saveBtn").textContent = currentAsset ? "Update asset" : "Save new asset";
  for(const fig of document.querySelectorAll("#exports .exp"))
    fig.classList.toggle("on", fig.dataset.asset === currentAsset);
}

// ---- marquee (drag) selection: geometry tested in SVG user space against the box ----
function ptInRect(x, y, r){ return x>=r.x0 && x<=r.x1 && y>=r.y0 && y<=r.y1; }
function ccw(ax,ay,bx,by,cx,cy){ return (cy-ay)*(bx-ax) > (by-ay)*(cx-ax); }
function segInt(ax,ay,bx,by,cx,cy,dx,dy){                        // do segments ab and cd cross?
  return ccw(ax,ay,cx,cy,dx,dy)!==ccw(bx,by,cx,cy,dx,dy) && ccw(ax,ay,bx,by,cx,cy)!==ccw(ax,ay,bx,by,dx,dy);
}
function segHitsRect(ax,ay,bx,by,r){
  if(ptInRect(ax,ay,r) || ptInRect(bx,by,r)) return true;       // an endpoint lands inside the box
  return segInt(ax,ay,bx,by, r.x0,r.y0, r.x1,r.y0) || segInt(ax,ay,bx,by, r.x1,r.y0, r.x1,r.y1)
      || segInt(ax,ay,bx,by, r.x1,r.y1, r.x0,r.y1) || segInt(ax,ay,bx,by, r.x0,r.y1, r.x0,r.y0);
}
function polyHitsRect(pts, r, closed){
  const n = pts.length, lim = closed ? n : n-1;
  for(let i=0;i<lim;i++){ const a=pts[i], b=pts[(i+1)%n]; if(segHitsRect(a[0],a[1],b[0],b[1],r)) return true; }
  return false;
}
function ptInPoly(x, y, pts){                                    // ray cast -- is (x,y) inside the ring?
  let inside=false;
  for(let i=0,j=pts.length-1;i<pts.length;j=i++){
    const xi=pts[i][0], yi=pts[i][1], xj=pts[j][0], yj=pts[j][1];
    if(((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}
function marqueeSelect(r, subtract){                            // plain drag adds touched elements; shift-drag removes them
  const apply = sid => subtract ? selected.delete(sid) : selected.add(sid);
  for(const b of model.blobs)                                   // a blob: boundary crosses the box, OR the box sits inside its fill
    if(!hidden.has(b.sid) && (polyHitsRect(b.boundary, r, true) || ptInPoly(r.x0, r.y0, b.boundary))) apply(b.sid);
  for(const e of model.edges)
    if(!hidden.has(e.sid) && polyHitsRect(e.pts, r, false)) apply(e.sid);
  render();
}

function wireCanvas(){
  const svg = $("#view");
  const badge = $("#numbadge");
  let mqStart=null, mqStartC=null, mqMoved=false, mqBox=null, justMarqueed=false;
  const toUser = e => clientToUser(svg, e);
  svg.addEventListener("mouseover", e => {
    const el = e.target.closest(".el"); if(el){                  // deleted segments hover too (to find/undelete them)
      el.classList.add("hover"); badge.textContent = "#" + el.dataset.num; badge.style.display = "flex";
    }
  });
  svg.addEventListener("mouseout", e => {
    const el = e.target.closest(".el"); if(el){ el.classList.remove("hover"); badge.style.display = "none"; }
  });
  svg.addEventListener("pointerdown", e => {
    if(e.button!==0) return;
    justMarqueed = false; mqStart = toUser(e); mqStartC = {x:e.clientX, y:e.clientY}; mqMoved = false;
  });
  svg.addEventListener("pointermove", e => {
    if(!mqStart) return;
    if(!mqMoved){
      if(Math.hypot(e.clientX-mqStartC.x, e.clientY-mqStartC.y) < 4) return;   // ignore click jitter
      mqMoved = true;
      mqBox = document.createElementNS(SVGNS, "rect"); mqBox.setAttribute("class", "marquee");
      svg.appendChild(mqBox); try{ svg.setPointerCapture(e.pointerId); }catch(_){}
    }
    const r = rectFrom(mqStart, toUser(e));
    mqBox.setAttribute("x", r.x0); mqBox.setAttribute("y", r.y0);
    mqBox.setAttribute("width", r.x1-r.x0); mqBox.setAttribute("height", r.y1-r.y0);
  });
  svg.addEventListener("pointerup", e => {
    if(mqBox){ mqBox.remove(); mqBox = null; }
    if(mqStart && mqMoved){ marqueeSelect(rectFrom(mqStart, toUser(e)), e.shiftKey); justMarqueed = true; }
    mqStart = null; mqMoved = false;
  });
  svg.addEventListener("click", e => {
    if(justMarqueed){ justMarqueed = false; return; }            // a drag just finished -- swallow the click
    const el = e.target.closest(".el"); if(!el) return;
    const sid = el.dataset.sid;
    if(hidden.has(sid)){                                         // a deleted segment: plain toggle only (to queue it for undelete)
      selected.has(sid) ? selected.delete(sid) : selected.add(sid);
    } else if(e.metaKey){                                        // flood the connected component
      const comp = floodFrom(sid), remove = e.shiftKey;          // ⇧⌘ = anti-fill (remove); ⌘ = fill (add)
      for(const s of comp) remove ? selected.delete(s) : selected.add(s);
    } else if(e.altKey){                                         // select one continuity stroke (through crossings)
      for(const s of strokeChain(sid)) selected.add(s);
    } else {                                                     // toggle one element
      selected.has(sid) ? selected.delete(sid) : selected.add(sid);
    }
    render();
  });
}

function activeSel(){ return [...selected].filter(s => !hidden.has(s)); }

function selectAll(){                                            // every un-hidden element in the drawing
  for(const b of model.blobs) if(!hidden.has(b.sid)) selected.add(b.sid);
  for(const e of model.edges) if(!hidden.has(e.sid)) selected.add(e.sid);
  render();
}

function clearSelection(){ selected.clear(); render(); }

function deleteSelected(){
  const s = activeSel(); if(!s.length) return;
  for(const sid of s) hidden.add(sid);
  selected.clear();
  render();
}

function undeleteSelected(){                                     // restore the selected deleted segments
  const s = [...selected].filter(sid => hidden.has(sid)); if(!s.length) return;
  for(const sid of s){ hidden.delete(sid); selected.delete(sid); }
  render();
}

function displayName(){ return (($("#assetName").value||"").trim()) || "unnamed"; }
function assetsFor(subject){                                      // this box's assets, de-duped by id (latest entry per asset)
  const box = SCANBOXES.find(b => b.name === subject);
  const map = new Map();
  for(const e of ((box && box.exports) || [])) map.set(e.asset, e);
  return [...map.values()];
}
function renderExports(subject){                                  // thumbnail of each saved asset; click one to reload its state
  const assets = assetsFor(subject), box = $("#exports");
  box.innerHTML = "";
  if(!assets.length){ box.innerHTML = '<div class="none">no assets yet</div>'; return; }
  for(const a of assets){                                         // build each figure and close over its asset directly
    const label = a.name || a.asset.replace(/\.svg$/, "");
    const fig = document.createElement("figure");
    fig.className = "exp" + (a.asset === currentAsset ? " on" : "");
    fig.dataset.asset = a.asset;
    fig.innerHTML = `<div class="thumb"><img src="/svg/${encodeURIComponent(a.asset)}?t=${Date.now()}" alt="${label}">`
      + `<figcaption>${label}</figcaption></div><button class="trash" title="Delete asset">${TRASH}</button>`;
    fig.querySelector(".thumb").onclick = () => loadAsset(a);
    fig.querySelector(".trash").onclick = () => deleteAsset(a);   // its own control, beside the drawing
    box.appendChild(fig);
  }
}
async function syncBoxes(){                                        // reload this scan's boxes and re-render every view that reads them
  const bd = await (await fetch("/boxes")).json();
  if(SCAN) SCANBOXES = (bd.boxes || []).filter(b => b.scan === SCAN);
  renderTabs(); renderExports(model.subject); updateAssetBar();
}
function deleteAsset(a){
  postJSON("/asset/delete", {subject: model.subject, asset: a.asset})
    .then(async res => {
      if(!res.ok){ console.error("delete failed"); return; }
      if(currentAsset === a.asset) currentAsset = null;           // was loaded in the editor -> deselect
      await syncBoxes();
    })
    .catch(() => console.error("delete failed (is the server running?)"));
}

function currentState(){ return { hidden: [...hidden], rot, flipX, flipY }; }

function buildAssetSvg(){                                        // every non-hidden element, cropped tight to content
  const m = model, sw = Math.max(1, m.w);
  const blobs = m.blobs.filter(b => !hidden.has(b.sid));
  const edges = m.edges.filter(e => !hidden.has(e.sid));
  if(!blobs.length && !edges.length) return null;

  const bb = contentBounds({blobs, edges}), pad = sw/2 + 1;     // tight bounds over the kept geometry, caps off the crop
  const x0 = bb.x0-pad, y0 = bb.y0-pad, w = bb.x1-bb.x0+2*pad, h = bb.y1-bb.y0+2*pad;
  const col = c => `rgb(${rgbOf(c).join(",")})`;
  const out = [`<svg viewBox="${x0.toFixed(1)} ${y0.toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}" xmlns="${SVGNS}">`];
  for(const b of blobs) out.push(`<path d="${blobPathD(b)}" fill="${col(b.color)}" fill-rule="evenodd"/>`);
  out.push(`<g fill="none" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">`);
  for(const e of edges) out.push(`<polyline points="${edgePts(e)}" stroke="${col(e.color)}"/>`);
  out.push("</g></svg>");
  return out.join("");
}

function saveAsset(assetId){                                     // assetId null -> a new asset; else update that asset in place
  const svg = buildAssetSvg();
  if(svg === null){ alert("Nothing to save — everything is hidden."); return; }
  const body = { subject: model.subject, name: displayName(), svg, state: currentState() };
  if(assetId) body.asset = assetId;
  postJSON("/export", body)
    .then(async res => {
      if(!res.ok){ console.error("save failed"); return; }
      currentAsset = res.asset;                                  // now editing the saved asset -> further ⌘S updates it
      await syncBoxes();
    })
    .catch(() => console.error("save failed (is the server running?)"));
}

// wire buttons
wireCanvas();                                                    // once: #view is a stable node, draw() only repopulates it
$("#saveBtn").onclick = () => saveAsset(currentAsset);           // null -> new asset; set -> update it in place
$("#tabBoxer").onclick = () => { if(!$("#tabBoxer").disabled) location.href = "/?scan=" + encodeURIComponent(SCAN); };
$("#scBtn").onclick = () => {                                    // toggle the shortcuts panel (rightmost box)
  const sc = $("#shortcuts"); sc.hidden = !sc.hidden;
  $("#scBtn").classList.toggle("on", !sc.hidden); placeRotcol();
};
window.addEventListener("resize", placeRotcol);
$("#rotSlider").oninput = e => { setTransform(+e.target.value, flipX, flipY); applyTransform(); };
$("#flipXBtn").onclick = () => { setTransform(rot, !flipX, flipY); applyTransform(); };
$("#flipYBtn").onclick = () => { setTransform(rot, flipX, !flipY); applyTransform(); };
$("#revecBtn").onclick = revectorize;
$("#scanOrigBtn").onclick = () => showScan("orig");
$("#scanCleanBtn").onclick = () => { if(baseModel.scan_clean) showScan("clean"); };
$("#clrBtn").onclick = clearSelection;
$("#resetBtn").onclick = () => loadSubject(model.subject);
document.addEventListener("keydown", e => {
  if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;        // don't hijack typing in the asset-name field
  if((e.metaKey || e.ctrlKey) && (e.key==="a" || e.key==="A")){ e.preventDefault(); e.shiftKey ? clearSelection() : selectAll(); }
  else if((e.metaKey || e.ctrlKey) && (e.key==="s" || e.key==="S")){ e.preventDefault(); saveAsset(currentAsset); }
  else if(e.key==="Delete" || e.key==="Backspace"){ e.preventDefault(); deleteSelected(); }
  else if(e.key==="u" || e.key==="U"){ e.preventDefault(); undeleteSelected(); }
});

// subject buttons -- full titles for the demo subjects; boxed subjects use their box name
const TITLES = {flag:"Capture flag", cannon:"Wheeled cannon", soldier:"Gunner’s SMG",
                mg:"Mounted MG", dying:"Hit soldier"};
async function loadModels(){
  const list = await (await fetch("/models")).json();
  MODELS = Object.fromEntries(list.map(m => [m.subject, m]));
}
function renderTabs(){                                          // tabs = the current scan's boxes (✓ = has an export)
  $("#subjects").innerHTML = SCANBOXES.map(b =>
    `<button data-name="${b.name}" class="${MODELS[b.name] ? '' : 'pending'}">${TITLES[b.name] || b.name}` +
    `${(b.exports && b.exports.length) ? '<span class="chk">✓</span>' : ''}</button>`).join("");
  for(const btn of document.querySelectorAll(".subjects button")) btn.onclick = () => selectBox(btn.dataset.name);
  if(model) document.querySelectorAll(".subjects button").forEach(b => b.classList.toggle("on", b.dataset.name === model.subject));
}
async function vectorizeBox(name){                             // (re)run the pipeline on this box; true on success
  const box = SCANBOXES.find(b => b.name === name);
  $("#errbox").hidden = true;                                  // clear any prior failure
  $("#waitmsg").textContent = `vectorizing ${TITLES[name] || name}…`;
  $("#waiting").hidden = false;                                // waiting indicator right in the drawing area
  try {
    const res = await fetch("/vectorize", {method:"POST", headers:{"Content-Type":"application/json"},
                                           body: JSON.stringify({scan: SCAN, boxes: [box]})});
    if(!res.ok){                                               // pipeline threw -- surface the server traceback, copyable
      let tb; try { tb = (await res.json()).error; } catch(_) { tb = await res.text(); }
      showVectorizeError(name, tb || `vectorize failed (HTTP ${res.status})`);
      return false;
    }
    await loadModels(); renderTabs();
    return true;
  } catch(e) {
    showVectorizeError(name, "vectorize request failed — is the server running?\n\n" + (e && e.stack || e));
    return false;
  }
}
function showVectorizeError(name, text){                        // replace the drawing area with a copyable stack trace
  $("#waiting").hidden = true;
  const box = $("#errbox");
  box.value = `vectorize failed for ${TITLES[name] || name}:\n\n${text}`;
  box.hidden = false;
}
async function selectBox(name){
  if(!MODELS[name]){                                            // not vectorized yet: show the original scan crop at once, then vectorize
    showScanCrop(SCANBOXES.find(b => b.name === name));
    if(!(await vectorizeBox(name))) return;                     // bail on failure (overlay shows the error)
  }
  loadSubject(name);                                            // clears the overlay once the model is in hand
}
async function revectorize(){                                  // re-run the pipeline on the current box (e.g. after a pipeline change)
  if(!SCAN || !(model && model.subject)) return;               // only a boxed subject can be re-vectorized
  if(await vectorizeBox(model.subject)) loadSubject(model.subject);
}
function openScan(name){                                        // switch the asset tool to another scan: its last box, else its first
  if(name === SCAN) return;
  const last = localStorage.getItem("pv:lastbox:" + name);
  location.href = "/asset?scan=" + encodeURIComponent(name) + (last ? "&subject=" + encodeURIComponent(last) : "");
}
async function boot(){
  const p = new URLSearchParams(location.search);
  SCAN = p.get("scan"); const want = p.get("subject");
  renderScanList(SCAN, openScan).catch(() => {});                // the same scan picker as the boxer, current scan highlighted
  const [, boxData] = await Promise.all([loadModels(), fetch("/boxes").then(r => r.json())]);   // independent -> parallel
  if(SCAN){
    SCANBOXES = (boxData.boxes || []).filter(b => b.scan === SCAN);
    const coords = (p.get("box") || "").split(",").map(Number);  // a freshly-drawn box passes its coords, not yet in boxes.json
    if(want && coords.length === 4 && !coords.some(isNaN) && !SCANBOXES.some(b => b.name === want))
      SCANBOXES.push({name: want, scan: SCAN, x0: coords[0], y0: coords[1], x1: coords[2], y1: coords[3]});
  } else {                                                      // no scan context: show every vectorized subject
    SCANBOXES = Object.keys(MODELS).map(n => ({name: n}));
    $("#tabBoxer").disabled = true;                             // nothing to go back to without a scan
    $("#revecBtn").disabled = true;                             // demo subjects have no box to re-vectorize
  }
  if(!SCANBOXES.length){ $("#subjects").innerHTML = '<span style="color:var(--muted);font-size:12px">no boxes — mark some in the scan view</span>'; return; }
  renderTabs();
  const names = SCANBOXES.map(b => b.name);
  selectBox((want && names.includes(want)) ? want : names[0]);
}
boot();
</script>
</body>

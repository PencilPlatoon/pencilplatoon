<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pencil Vector · Scan Boxer</title>
<style>
  :root{--bg:#16171b;--panel:#1e2026;--hair:#31333c;--ink:#e9e7e0;--muted:#9a978d;
    --blue:#5878e6;--red:#e8402f;--green:#37b26a;--btn:#3a3f4d;--btn-line:#4c5264;
    --sans:system-ui,-apple-system,"Segoe UI",sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace;}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);display:flex;flex-direction:column;height:100vh}
  header{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--hair)}
  header h1{font-size:15px;margin:0;font-weight:600}
  .tabs{display:flex;gap:4px}
  .tab{font:inherit;font-size:12.5px;padding:6px 13px;border-radius:7px;cursor:pointer;
    background:var(--btn);border:1px solid var(--btn-line);color:var(--ink)}
  .tab:hover:not(.on):not(:disabled){border-color:var(--blue)}
  .tab.on{background:var(--blue);border-color:var(--blue);color:#fff;cursor:default}
  .tab:disabled{opacity:.4;cursor:not-allowed}
  .stage{flex:1;display:flex;min-height:0}
  .scans{width:190px;flex:none;border-right:1px solid var(--hair);display:flex;flex-direction:column;min-height:0}
  .scans h3{margin:0;padding:12px 16px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
  #scanlist{margin:0;padding:8px;list-style:none;overflow:auto;flex:1;display:flex;flex-direction:column;gap:3px}
  #scanlist li{flex:none;font-family:var(--mono);font-size:12px;padding:6px 9px;border-radius:6px;cursor:pointer;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid transparent}
  #scanlist li:hover:not(.on){background:var(--panel)}
  #scanlist li.on{background:var(--blue);color:#fff}
  .canvas{flex:1;display:grid;place-items:center;padding:16px;overflow:auto;position:relative}
  .drop{color:var(--muted);font-size:14px;text-align:center;padding:48px 32px;border:2px dashed var(--hair);border-radius:12px;max-width:420px}
  .imgwrap{position:relative;line-height:0;box-shadow:0 12px 40px -16px #000;border-radius:4px}
  .imgwrap img{display:block;max-width:100%;max-height:calc(100vh - 130px);border-radius:4px}
  .imgwrap svg{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
  .box{fill:rgba(88,120,230,.12);stroke:var(--blue);stroke-width:2;vector-effect:non-scaling-stroke}
  .drawn{cursor:pointer} .drawn:hover .box{fill:rgba(88,120,230,.22)}
  .lbl{fill:var(--blue);font-family:var(--mono);font-weight:600}
  aside{width:236px;border-left:1px solid var(--hair);display:flex;flex-direction:column;min-height:0}
  aside h3{margin:0;padding:12px 16px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
  #boxlist{margin:0;padding:8px 12px;list-style:none;overflow:auto;flex:1;display:flex;flex-direction:column;gap:6px}
  #boxlist li{position:relative;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--hair);border-radius:7px;padding:5px 7px}
  .chk{position:absolute;top:-6px;right:-6px;width:16px;height:16px;border-radius:50%;background:var(--green);
    color:#fff;font:700 10px/16px var(--sans);text-align:center;box-shadow:0 0 0 2px var(--bg)}
  #boxlist input{flex:1;min-width:0;font:inherit;font-size:12px;font-family:var(--mono);background:var(--bg);
    border:1px solid var(--hair);border-radius:5px;color:var(--ink);padding:4px 6px}
  #boxlist input:focus{outline:none;border-color:var(--blue)}
  #boxlist .go{cursor:pointer;color:var(--blue);border:none;background:none;font-size:17px;line-height:1;padding:0 4px}
  #boxlist .go:hover{color:#fff}
  #boxlist .del{cursor:pointer;color:var(--muted);border:none;background:none;padding:0 2px;display:flex;align-items:center}
  #boxlist .del:hover{color:var(--red)}
  #boxlist .del svg{display:block}
  #boxlist .empty{color:var(--muted);font-size:12px;padding:8px}
  .hint{padding:9px 16px;border-top:1px solid var(--hair);font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.5}
</style>
</head>
<body>
<header>
  <h1>Pencil&nbsp;Vector</h1>
  <div class="tabs">
    <button id="tabBoxer" class="tab on">box selector</button>
    <button id="tabAsset" class="tab" disabled title="mark at least one box first">asset tool</button>
  </div>
</header>
<div class="stage">
  <aside class="scans">
    <h3>Scans</h3>
    <ul id="scanlist"></ul>
  </aside>
  <div class="canvas" id="canvas">
    <div class="drop" id="drop">Choose a scan on the left, then drag a box around each subject.</div>
    <div class="imgwrap" id="imgwrap" hidden>
      <img id="scan" alt="scan">
      <svg id="ov" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>
  <aside>
    <h3>Boxes</h3>
    <ol id="boxlist"><li class="empty">none yet</li></ol>
    <div class="hint">drag = new box · click a box = open it in the asset tool · rename in the list</div>
  </aside>
</div>
<script>
const $ = s => document.querySelector(s);
const SVGNS = "http://www.w3.org/2000/svg";
const TRASH = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" '
  + 'stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V5h6v2"/>'
  + '<path d="M6 7l1 13h10l1-13"/><path d="M10 11v6M14 11v6"/></svg>';
const ov = $("#ov"), img = $("#scan");
let scanName = null, boxes = [], seq = 0, LBL = 14;

fetch("/scans").then(r => r.json()).then(list => {
  const ul = $("#scanlist");
  ul.innerHTML = list.map(n => `<li data-scan="${encodeURIComponent(n)}">${n}</li>`).join("");
  for(const li of ul.children) li.onclick = () => selectScan(decodeURIComponent(li.dataset.scan));
  const want = new URLSearchParams(location.search).get("scan");   // came back from the asset tool -> reopen that scan
  if(want && list.includes(want)) selectScan(want);
}).catch(() => console.error("no server — run: npm run vector-server"));

function selectScan(name){
  for(const li of $("#scanlist").children) li.classList.toggle("on", decodeURIComponent(li.dataset.scan) === name);
  loadScan(name);
}

$("#tabAsset").onclick = () => {                                  // switch to the asset tool: the last box visited, else the first
  if($("#tabAsset").disabled || !boxes.length) return;
  const last = localStorage.getItem("pv:lastbox:" + scanName);
  openBox(boxes.find(b => b.name === last) || boxes[0]);
};

async function loadScan(name){
  scanName = name;
  const all = await (await fetch("/boxes")).json();              // pre-load boxes already marked on this scan
  const mine = (all.boxes || []).filter(b => b.scan === name);
  img.onload = () => {
    ov.setAttribute("viewBox", `0 0 ${img.naturalWidth} ${img.naturalHeight}`);
    LBL = Math.max(10, Math.round(img.naturalHeight / 45));
    $("#drop").hidden = true; $("#imgwrap").hidden = false;
    boxes = mine.map(b => ({name:b.name, x0:b.x0, y0:b.y0, x1:b.x1, y1:b.y1, serverName:b.name,
                            done:!!(b.exports && b.exports.length)}));
    seq = Math.max(0, ...boxes.map(b => { const m = /^box(\d+)$/.exec(b.name); return m ? +m[1] : 0; }));
    render();
  };
  img.src = "/scan/" + encodeURIComponent(name);
}

function toImg(ev){                                       // client coords -> scan-pixel coords
  const p = ov.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY;
  const u = p.matrixTransform(ov.getScreenCTM().inverse());
  return {x: u.x, y: u.y};
}
function norm(a, b){ return {x0:Math.round(Math.min(a.x,b.x)), y0:Math.round(Math.min(a.y,b.y)),
                             x1:Math.round(Math.max(a.x,b.x)), y1:Math.round(Math.max(a.y,b.y))}; }

let start=null, cur=null, live=null;
ov.addEventListener("pointerdown", e => {
  if(e.button!==0) return;
  start = toImg(e); cur = null; ov.setPointerCapture(e.pointerId);
  live = document.createElementNS(SVGNS,"rect"); live.setAttribute("class","box"); ov.appendChild(live);
});
ov.addEventListener("pointermove", e => {
  if(!start) return;
  cur = toImg(e); const r = norm(start, cur);
  live.setAttribute("x", r.x0); live.setAttribute("y", r.y0);
  live.setAttribute("width", r.x1-r.x0); live.setAttribute("height", r.y1-r.y0);
});
ov.addEventListener("pointerup", () => {
  const clickPt = start; let dragged = false;
  if(start && cur){ const r = norm(start, cur);
    if(r.x1-r.x0 > 4 && r.y1-r.y0 > 4){ const b = {name:"box"+(++seq), ...r}; boxes.push(b); dragged = true; saveBox(b); } }
  if(live){ live.remove(); live = null; }
  start = cur = null; render();
  if(!dragged && clickPt){                                        // a click on an existing box -> open it in the asset tool
    const b = boxes.find(x => clickPt.x>=x.x0 && clickPt.x<=x.x1 && clickPt.y>=x.y0 && clickPt.y<=x.y1);
    if(b) openBox(b);
  }
});

function saveBox(b){                                            // persist a drawn box def at once so it survives navigation
  const name = b.name;                                          // capture: a rename before this lands leaves serverName != name
  fetch("/box", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({name, scan:scanName, x0:b.x0, y0:b.y0, x1:b.x1, y1:b.y1})})
    .then(() => { b.serverName = name; })
    .catch(() => console.error("failed to save box (is the server running?)"));
}

function openBox(b){
  // box coords ride along so the asset tool can vectorize even if the /box save hasn't landed yet (draw-then-click race)
  const url = `/asset?scan=${encodeURIComponent(scanName)}&subject=${encodeURIComponent(b.name)}`
            + `&box=${b.x0},${b.y0},${b.x1},${b.y1}`;
  if(b.serverName && b.name !== b.serverName){                   // renamed since it was persisted -> propagate first
    fetch("/rename", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({old:b.serverName, new:b.name})})
      .then(() => { b.serverName = b.name; location.href = url; })
      .catch(() => console.error("rename failed (is the server running?)"));
    return;
  }
  location.href = url;
}

function render(){
  [...ov.querySelectorAll(".drawn")].forEach(n => n.remove());
  for(const b of boxes){
    const g = document.createElementNS(SVGNS,"g"); g.setAttribute("class","drawn");
    const r = document.createElementNS(SVGNS,"rect"); r.setAttribute("class","box");
    r.setAttribute("x",b.x0); r.setAttribute("y",b.y0); r.setAttribute("width",b.x1-b.x0); r.setAttribute("height",b.y1-b.y0);
    const t = document.createElementNS(SVGNS,"text"); t.setAttribute("class","lbl");
    t.setAttribute("x", b.x0+LBL*0.3); t.setAttribute("y", b.y0+LBL); t.setAttribute("font-size", LBL);
    t.textContent = b.name;
    g.append(r, t);
    if(b.done){                                                  // green check: at least one svg saved from this box
      const cr = LBL*0.6;
      const c = document.createElementNS(SVGNS,"circle");
      c.setAttribute("cx", b.x1-cr); c.setAttribute("cy", b.y0+cr); c.setAttribute("r", cr);
      c.setAttribute("fill","#37b26a"); c.setAttribute("stroke","#fff"); c.setAttribute("stroke-width", LBL*0.1);
      const ck = document.createElementNS(SVGNS,"text");
      ck.setAttribute("x", b.x1-cr); ck.setAttribute("y", b.y0+cr+cr*0.36); ck.setAttribute("font-size", cr*1.3);
      ck.setAttribute("fill","#fff"); ck.setAttribute("text-anchor","middle"); ck.setAttribute("font-weight","700");
      ck.textContent = "✓";
      g.append(c, ck);
    }
    ov.appendChild(g);
  }
  $("#tabAsset").disabled = !boxes.length;                       // asset tool needs at least one box
  const list = $("#boxlist");
  list.innerHTML = boxes.length ? "" : '<li class="empty">none yet</li>';
  boxes.forEach((b, i) => {
    const li = document.createElement("li");
    const inp = document.createElement("input"); inp.value = b.name;
    inp.oninput = () => { b.name = inp.value; const t = ov.querySelectorAll(".drawn text")[i]; if(t) t.textContent = b.name; };
    inp.onchange = () => {                                        // commit a rename -> propagate to the persisted box def
      if(b.serverName && b.name && b.name !== b.serverName)
        fetch("/rename", {method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({old:b.serverName, new:b.name})}).then(() => { b.serverName = b.name; });
    };
    const go = document.createElement("button"); go.className = "go"; go.textContent = "→"; go.title = "open in asset tool";
    go.onclick = () => openBox(b);
    const del = document.createElement("button"); del.className = "del"; del.title = "delete box"; del.innerHTML = TRASH;
    del.onclick = () => {                                         // drop it on the server too, so it stays gone
      fetch("/box/delete", {method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({name: b.serverName || b.name})});
      boxes.splice(i,1); render();
    };
    li.append(del, inp, go);                                      // trash on the left, then name, then open
    if(b.done){ const chk = document.createElement("span"); chk.className = "chk"; chk.textContent = "✓"; li.append(chk); }
    list.appendChild(li);
  });
}

</script>
</body>
</html>

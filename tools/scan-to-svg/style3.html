<title>Scan to SVG — isolated components</title>
<style>
  :root{
    --desk:#17181c; --panel:#212229; --panel-2:#191a1f;
    --paper:#f6f1e6; --ink:#e8e5dd; --muted:#9b988d; --hair:#33343c;
    --blue:#4763d0; --blood:#c23423;
    --sans:system-ui,-apple-system,"Segoe UI",sans-serif;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--desk)}
  .top-anchor{position:absolute;top:0}
  .wrap{background:radial-gradient(120% 80% at 50% -10%,#20222a 0%,var(--desk) 60%);
    color:var(--ink);font-family:var(--sans);line-height:1.55;padding:clamp(20px,4vw,56px)}
  .wrap>*{max-width:1290px;margin-inline:auto}
  /* element-number toggle */
  #shownums{position:fixed;opacity:0;width:0;height:0;pointer-events:none}
  .numtoggle{position:fixed;top:16px;right:16px;z-index:800;background:var(--panel);
    border:1px solid var(--hair);color:var(--ink);padding:9px 15px;border-radius:20px;
    font-size:13px;cursor:pointer;user-select:none;display:flex;gap:9px;align-items:center;
    box-shadow:0 6px 20px -8px #000}
  .numtoggle:hover{border-color:var(--blue)}
  .numtoggle .dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--muted)}
  #shownums:checked ~ .numtoggle .dot{background:var(--blue);border-color:var(--blue)}
  #shownums:focus-visible ~ .numtoggle{outline:2px solid var(--blue);outline-offset:2px}
  .nums{display:none;pointer-events:none}
  #shownums:checked ~ .wrap .nums{display:inline}
  code{font-family:var(--mono);font-size:.85em;background:var(--panel);
    padding:.12em .42em;border-radius:4px;color:#d6d2c6}
  em{font-style:normal;color:#fff;font-weight:600}
  h2{font-family:var(--serif);font-weight:600;font-size:clamp(22px,3vw,30px);margin:0}

  .masthead{padding-bottom:clamp(22px,3vw,36px);border-bottom:1px solid var(--hair)}
  .eyebrow{font-family:var(--mono);text-transform:uppercase;letter-spacing:.18em;
    font-size:12px;color:var(--blue);margin:0 0 14px}
  h1{font-family:var(--serif);font-weight:600;font-size:clamp(32px,5.5vw,54px);
    line-height:1.03;margin:0;text-wrap:balance;letter-spacing:-.01em}
  .dek{max-width:74ch;color:var(--muted);font-size:clamp(15px,1.5vw,17px);margin:16px 0 0}

  .featured{padding:clamp(26px,4vw,44px) 0;border-bottom:1px solid var(--hair)}
  .feat-head p{color:var(--muted);max-width:64ch;margin:8px 0 22px}
  .feat-cells{grid-template-columns:repeat(3,1fr)}

  .cells{display:grid;gap:16px}
  .tile{position:relative;margin:0;background:var(--panel);border:1px solid var(--hair);
    border-radius:10px;padding:12px;transition:border-color .15s,transform .15s}
  .tile:hover{border-color:var(--blue);transform:translateY(-2px)}
  .art{background:var(--paper);border-radius:6px;height:330px;display:grid;place-items:center;
    padding:14px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);overflow:hidden;position:relative;z-index:2;cursor:crosshair}
  .art svg,.art img{max-height:100%;max-width:100%;width:auto;height:auto;display:block}
  /* pure-CSS hover-to-identify: wide invisible hit-areas drive the highlight + corner number */
  .seg .vis,.seg .corner{pointer-events:none}
  .hit{pointer-events:all}
  .corner{display:none}
  .seg:hover .corner{display:inline}
  .seg:hover .vis path{stroke:#e8402f}
  .seg:hover .vis path[fill]:not([fill="none"]){fill:#e8402f}
  .seg:hover .vis circle{stroke:#e8402f}
  .seg:hover .vis circle[fill]:not([fill="none"]){fill:#e8402f}
  /* left "overlay" panel: the aligned scan with the vector hidden on top of it. The right
     (clean) panel drives the hover; the matching segment then draws red here on the scan.
     Per-segment link rules are generated in build3.py. */
  .art.overlay .vis path{stroke:transparent;fill:transparent}
  .art.overlay .vis circle{stroke:transparent;fill:transparent}
  .art.overlay .hit{pointer-events:none}
  .zoombtn{position:absolute;top:15px;right:15px;z-index:6;width:34px;height:34px;border-radius:50%;
    background:var(--panel);border:1px solid var(--hair);color:var(--ink);display:grid;place-items:center;text-decoration:none}
  .zoombtn:hover{border-color:var(--blue);color:var(--blue)}
  figcaption{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:11px}
  .k{font-size:13px;color:var(--ink)}
  .m{font-family:var(--mono);font-size:11px;color:var(--muted);
    font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
  .zclose{display:none}

  .matrix{padding-top:clamp(26px,4vw,44px)}
  .matrix .sub{color:var(--muted);max-width:74ch;margin:8px 0 26px}
  .row{display:grid;grid-template-columns:190px 1fr;gap:24px;padding:22px 0;border-top:1px solid var(--hair)}
  .rowhead h3{font-family:var(--serif);font-weight:600;font-size:20px;margin:0}
  .rowhead p{color:var(--muted);font-size:13px;margin:6px 0 0}
  .row .cells{grid-template-columns:repeat(3,1fr)}

  /* Pencil Vector cell: a milestone tab-strip (M1, M2, …) over one cell; shows one render at a
     time. The panels use display:contents so the shown SVG becomes a direct child of .art and
     sizes exactly like the other columns' SVGs (a wrapper would break the % height chain); the
     tab strip floats in reserved top padding. Radios drive it (pure CSS); tabs/panels stay in
     milestone order so nth-of-type lines them up. Static rules cover up to 8 milestones. */
  .art.pv{position:relative;padding-top:38px;cursor:default}
  .pvr{position:absolute;width:0;height:0;opacity:0;pointer-events:none}
  .pvtabs{position:absolute;top:9px;left:10px;right:10px;z-index:4;display:flex;gap:6px;
    flex-wrap:wrap;justify-content:center}
  .pvtabs label{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--muted);
    background:var(--panel-2);border:1px solid var(--hair);border-radius:20px;padding:3px 11px;
    cursor:pointer;transition:color .12s,border-color .12s,background .12s}
  .pvtabs label:hover{border-color:var(--blue);color:var(--ink)}
  .pvpanels{display:contents}
  .pvpanel{display:none}
  .pv:has(.pvr:nth-of-type(1):checked) .pvpanel:nth-of-type(1){display:contents}
  .pv:has(.pvr:nth-of-type(2):checked) .pvpanel:nth-of-type(2){display:contents}
  .pv:has(.pvr:nth-of-type(3):checked) .pvpanel:nth-of-type(3){display:contents}
  .pv:has(.pvr:nth-of-type(4):checked) .pvpanel:nth-of-type(4){display:contents}
  .pv:has(.pvr:nth-of-type(5):checked) .pvpanel:nth-of-type(5){display:contents}
  .pv:has(.pvr:nth-of-type(6):checked) .pvpanel:nth-of-type(6){display:contents}
  .pv:has(.pvr:nth-of-type(7):checked) .pvpanel:nth-of-type(7){display:contents}
  .pv:has(.pvr:nth-of-type(8):checked) .pvpanel:nth-of-type(8){display:contents}
  .pv:has(.pvr:nth-of-type(1):checked) .pvtabs label:nth-of-type(1),
  .pv:has(.pvr:nth-of-type(2):checked) .pvtabs label:nth-of-type(2),
  .pv:has(.pvr:nth-of-type(3):checked) .pvtabs label:nth-of-type(3),
  .pv:has(.pvr:nth-of-type(4):checked) .pvtabs label:nth-of-type(4),
  .pv:has(.pvr:nth-of-type(5):checked) .pvtabs label:nth-of-type(5),
  .pv:has(.pvr:nth-of-type(6):checked) .pvtabs label:nth-of-type(6),
  .pv:has(.pvr:nth-of-type(7):checked) .pvtabs label:nth-of-type(7),
  .pv:has(.pvr:nth-of-type(8):checked) .pvtabs label:nth-of-type(8){
    background:var(--blue);border-color:var(--blue);color:#fff}
  .pv:has(.pvr:focus-visible) .pvtabs{outline:2px solid var(--blue);outline-offset:3px;border-radius:22px}

  .foot{border-top:1px solid var(--hair);margin-top:8px;padding-top:24px}
  .foot p{color:var(--muted);font-size:14.5px;max-width:76ch;margin:0 0 12px}

  /* ---- pure-CSS zoom via :target ---- */
  .tile:target{position:fixed;inset:0;z-index:900;margin:0;border:none;border-radius:0;
    background:rgba(11,11,13,.93);backdrop-filter:blur(3px);padding:clamp(20px,5vh,64px);
    display:grid;place-items:center;transform:none}
  .tile:target .zclose{display:block;position:fixed;inset:0;z-index:1;cursor:zoom-out}
  .tile:target .art{position:relative;z-index:2;height:auto;max-height:84vh;max-width:92vw;width:auto;
    padding:min(5vw,48px);border-radius:12px;box-shadow:0 30px 80px -20px #000}
  .tile:target .art svg,.tile:target .art img{max-height:76vh;max-width:88vw}
  .tile:target .art img{image-rendering:pixelated}
  .tile:target .zoombtn{display:none}
  .tile:target figcaption{position:fixed;bottom:3vh;left:0;right:0;z-index:2;justify-content:center;font-family:var(--mono);color:var(--ink)}
  .tile:target .nums{display:inline}   /* numbers always visible in zoom */

  @media(max-width:820px){
    .feat-cells,.row .cells{grid-template-columns:1fr;max-width:420px}
    .row{grid-template-columns:1fr;gap:14px}
  }
</style>

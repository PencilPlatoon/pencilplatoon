<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Paper background (opaque so iOS/Android don't show black behind it) -->
  <rect width="512" height="512" fill="#ffffff"/>
  <!-- Grass -->
  <rect x="0" y="410" width="512" height="102" fill="#d8efd0"/>
  <!-- Ground line -->
  <line x1="0" y1="410" x2="512" y2="410" stroke="#141414" stroke-width="8"/>

  <g transform="translate(-12,0)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Rifle (black), aimed to the right -->
    <g stroke="#141414">
      <line x1="184" y1="258" x2="232" y2="238" stroke-width="18"/>   <!-- stock -->
      <line x1="218" y1="240" x2="356" y2="228" stroke-width="17"/>   <!-- barrel/receiver -->
      <line x1="286" y1="236" x2="282" y2="268" stroke-width="13"/>   <!-- magazine -->
    </g>

    <!-- Soldier (purple) -->
    <g stroke="#800080">
      <!-- legs -->
      <line x1="228" y1="322" x2="190" y2="408" stroke-width="22"/>
      <line x1="228" y1="322" x2="268" y2="408" stroke-width="22"/>
      <!-- body -->
      <line x1="228" y1="322" x2="228" y2="196" stroke-width="22"/>
      <!-- head -->
      <circle cx="228" cy="150" r="44" fill="#ffffff" stroke-width="22"/>
      <!-- arms to the rifle -->
      <line x1="228" y1="210" x2="266" y2="242" stroke-width="20"/>
      <line x1="228" y1="210" x2="314" y2="232" stroke-width="20"/>
    </g>
  </g>
</svg>
